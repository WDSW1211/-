<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你好，初次见面请多多关照</title>
<meta name="description" content="铃木绫的自我介绍页面 —— 零基础学习全栈开发时写下的第一篇文档。">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --bg: #f7f2e9;
    --card: rgba(255, 255, 255, 0.72);
    --ink: #2a2620;
    --muted: #6f6659;
    --line: rgba(42, 38, 32, 0.12);
    --accent: #b08d57;
    --shadow: 0 30px 60px -30px rgba(60, 45, 25, 0.35), 0 2px 6px rgba(60, 45, 25, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16140f;
      --card: rgba(28, 25, 20, 0.72);
      --ink: #efe8db;
      --muted: #a89d8b;
      --line: rgba(239, 232, 219, 0.14);
      --accent: #d6b483;
      --shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.8), 0 2px 6px rgba(0, 0, 0, 0.4);
    }
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(20px, 6vw, 64px) clamp(16px, 5vw, 32px);
    color: var(--ink);
    background-color: var(--bg);
    background-image:
      radial-gradient(1200px 620px at 8% -5%, rgba(214, 180, 131, 0.30), transparent 62%),
      radial-gradient(900px 520px at 102% 104%, rgba(122, 152, 182, 0.22), transparent 58%);
    font-family: "Hiragino Sans", "Noto Sans CJK SC", "PingFang SC",
                 "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .card {
    width: min(720px, 100%);
    padding: clamp(28px, 6vw, 64px);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 clamp(18px, 4vw, 28px);
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }

  .eyebrow::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--line), transparent);
  }

  h1 {
    margin: 0 0 0.5em;
    font-family: "Songti SC", "Noto Serif CJK SC", "Hiragino Mincho ProN",
                 "Yu Mincho", serif;
    font-size: clamp(1.7rem, 5.2vw, 2.6rem);
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: 0.02em;
    text-wrap: balance;
  }

  h1::after {
    content: "";
    display: block;
    width: 3.25rem;
    height: 3px;
    margin-top: 0.7em;
    border-radius: 999px;
    background: var(--accent);
  }

  h2 {
    margin: 0 0 clamp(16px, 3.5vw, 24px);
    color: var(--muted);
    font-size: clamp(0.98rem, 2.6vw, 1.12rem);
    font-weight: 500;
    line-height: 1.7;
  }

  h3 {
    display: inline-block;
    margin: 0 0 clamp(18px, 4vw, 26px);
    padding: 0.3em 0.95em;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    white-space: nowrap;
  }

  p {
    margin: 0;
    color: var(--ink);
    font-size: clamp(0.95rem, 2.4vw, 1.02rem);
    line-height: 1.95;
    text-wrap: pretty;
  }

  .signature {
    margin: clamp(26px, 5vw, 40px) 0 0;
    padding: 18px 22px;
    border-left: 3px solid var(--accent);
    border-radius: 0 14px 14px 0;
    background: linear-gradient(90deg, rgba(176, 141, 87, 0.14), rgba(176, 141, 87, 0));
    font-family: "Songti SC", "Noto Serif CJK SC", "Hiragino Mincho ProN",
                 "Yu Mincho", serif;
    font-size: clamp(1.05rem, 2.8vw, 1.28rem);
    font-weight: 600;
    line-height: 1.7;
    letter-spacing: 0.04em;
  }

  .card > * {
    animation: rise 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }
  .card > :nth-child(2) { animation-delay: 0.06s; }
  .card > :nth-child(3) { animation-delay: 0.12s; }
  .card > :nth-child(4) { animation-delay: 0.18s; }
  .card > :nth-child(5) { animation-delay: 0.24s; }
  .card > :nth-child(6) { animation-delay: 0.30s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .card > * { animation: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Hajimemashite</p>
    <h1>你好，初次见面请多多关照</h1>
    <h2>这是我零基础学习全栈开发时写的文档</h2>
    <h3>更新日期 2026 年 10 月 30 日</h3>
    <p>文档里面没有任何内容；文档会进入到 git 以及 github……</p>
    <p class="signature">我叫铃木绫，很高兴认识您</p>
  </main>
</body>
</html>
